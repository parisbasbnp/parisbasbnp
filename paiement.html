<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiements</title>
    <link rel="stylesheet" href="client.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Derniers paiements */
        .synthese-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        /* Toutes les sommes en rouge */
        .montant {
            color: #e53935;
            font-weight: bold;
        }

        /* Rond de profil fantôme */
        .profil-fantome {
            width: 40px;
            height: 40px;
            min-width: 40px;
            border-radius: 50%;
            background-color: #e5e5e5;
            color: #777;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <div class="app">

        <!-- En-tête vert -->
        <header>
            <h2>Paiements</h2>
        </header>

        <!-- Contenu -->
        <main>
            <section class="title-row">
                <h2>Vos paiements</h2>
                <span>Cartes, virements et opérations</span>
            </section>

            <!-- Mes cartes -->
            <section class="title-row">
                <h2>Mes cartes</h2>
            </section>

            <div class="cards">
                <div class="card" style="width:320px; height:200px; overflow:hidden; border-radius:12px;">
                    <img src="visa.PNG" alt="Visa Premier"
                         style="width:100%; border-radius:12px;">
                </div>

                <div class="card">
                    <img src="Master.PNG" alt="Mastercard"
                         style="width:100%; border-radius:12px;">
                </div>
            </div>

            <!-- Actions rapides -->
            <section class="actions">
                <button onclick="window.location.href='virement.html'">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                    <span>Effectuer un virement</span>
                </button>

                <button>
                    <i class="fa-solid fa-building-columns"></i>
                    <span>Ajouter un bénéficiaire</span>
                </button>

                <button onclick="window.location.href='mobile.html'">
                    <i class="fa-solid fa-mobile-screen-button"></i>
                    <span>Paiement mobile</span>
                </button>

                <button onclick="window.location.href='historique.html'">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    <span>Historique</span>
                </button>
            </section>

            <!-- Derniers paiements -->
            <section class="synthese">
                <h2>Derniers paiements</h2>

                <!-- Grasso Angelo Vincenzo : profil fantôme -->
                <div class="synthese-card">
                    <div class="profil-fantome">
                        <i class="fa-solid fa-ghost"></i>
                    </div>
                    <span>
                        Grasso Angelo Vincenzo -
                        <span class="montant">500 000,00 €</span>
                    </span>
                </div>

                <br>

                <!-- Amazon -->
                <div class="synthese-card">
                    <img src="amazon.jpg" alt="Amazon"
                         style="width:40px; height:40px; border-radius:8px;">
                    <span>
                        Amazon -
                        <span class="montant">39,99 €</span>
                    </span>
                </div>

                <br>

                <!-- Station Service -->
                <div class="synthese-card">
                    <img src="sta.jpg" alt="Station Service"
                         style="width:40px; height:40px; border-radius:8px;">
                    <span>
                        Station Service -
                        <span class="montant">75,00 €</span>
                    </span>
                </div>

                <br>

                <!-- Restaurant -->
                <div class="synthese-card">
                    <img src="rest.jpg" alt="Restaurant"
                         style="width:40px; height:40px; border-radius:8px;">
                    <span>
                        Restaurant -
                        <span class="montant">42,80 €</span>
                    </span>
                </div>
            </section>
        </main>

        <!-- Navigation -->
        <nav>
            <button onclick="window.location.href='client.html'">
                <i class="fa-solid fa-house"></i>
                <span>Accueil</span>
            </button>

            <button class="active">
                <i class="fa-solid fa-credit-card"></i>
                <span>Paiements</span>
            </button>

            <button onclick="window.location.href='decouvrir.html'">
                <i class="fa-solid fa-compass"></i>
                <span>Découvrir</span>
            </button>

            <button onclick="window.location.href='contact.html'">
                <i class="fa-solid fa-comments"></i>
                <span>Contact</span>
            </button>
        </nav>

    </div>

    <script src="client.js"></script>
</body>
</html>
